{#- The in-page confirmation for any form[data-confirm] on the page (the same dialog the Settings
    page uses): the question is the attribute's text, Confirm submits the form. Include once, at
    the end of the page's content. -#}
<dialog id="settings-confirm" class="confirm">
  <form method="dialog">
    <p class="question"></p>
    <div class="inline-form">
      <button type="submit" value="cancel">Cancel</button>
      <button type="submit" value="ok" class="danger">Confirm</button>
    </div>
  </form>
</dialog>
<script>
  (function () {
    var dialog = document.getElementById("settings-confirm");
    if (!dialog || typeof dialog.showModal !== "function") return;
    document.querySelectorAll("form[data-confirm]").forEach(function (f) {
      f.addEventListener("submit", function (e) {
        if (f.dataset.confirmed === "1") return;
        e.preventDefault();
        dialog.querySelector(".question").textContent = f.dataset.confirm;
        dialog.returnValue = "";
        dialog.onclose = function () {
          if (dialog.returnValue === "ok") { f.dataset.confirmed = "1"; f.requestSubmit ? f.requestSubmit() : f.submit(); }
        };
        dialog.showModal();
      });
    });
  })();
</script>
