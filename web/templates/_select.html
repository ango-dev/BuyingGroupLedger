{#- The page's own single-choice dropdown: the same <details class="multi"> the multi-select
    filters use, with radio inputs instead of checkboxes, so it submits exactly like a <select>
    (one `name=value`) and looks like the rest of the page rather than the browser's own popup.
    edit.js closes it on a pick and updates the summary; the form's own change trigger fires.

    choose(name, options, chosen, label='', klass='')
      options: (value, text) pairs, or bare values used as both; chosen: the current value
      (compared as text). -#}
{% macro choose(name, options, chosen, label='', klass='') -%}
{%- set ns = namespace(text='', pairs=[]) -%}
{%- for item in options %}{% if item is string or item is number %}{% set ns.pairs = ns.pairs + [(item, item)] %}{% else %}{% set ns.pairs = ns.pairs + [(item[0], item[1])] %}{% endif %}{% endfor -%}
{%- for value, text in ns.pairs %}{% if value | string == chosen | string %}{% set ns.text = text %}{% endif %}{% endfor -%}
{%- if not ns.text and ns.pairs %}{% set ns.text = ns.pairs[0][1] %}{% endif -%}
<details class="multi single {{ klass }}" data-param="{{ name }}">
  <summary>{% if label %}<span class="lbl">{{ label }}</span> {% endif %}<span class="summary-text"><span class="summary-value">{{ ns.text }}</span><span class="caret">▾</span></span></summary>
  <div class="menu">
    {% for value, text in ns.pairs %}<label><input type="radio" name="{{ name }}" value="{{ value }}" {{ 'checked' if value | string == chosen | string }}> {{ text }}</label>
    {% endfor %}
  </div>
</details>
{%- endmacro %}
