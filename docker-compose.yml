# One service = one instance. Run more instances by copying this with a different mounted
# config.json (e.g. per proxy pool). Secrets are injected at runtime, never baked in --
# .dockerignore keeps config.json and .state.json out of the build context.
#
# Works as-is on a Raspberry Pi (64-bit OS): the image builds for the host's own architecture, and
# no browser runs locally — Browser-Use Cloud holds it. See "Raspberry Pi" in README.md.
services:
  ledger:
    build: .
    image: buying-group-ledger
    container_name: buying-group-ledger
    restart: unless-stopped
    # OPTIONAL. Everything lives in config.json now, including the container knobs below — .env is
    # purely the OVERRIDE layer, for values that should differ on THIS host without editing the
    # config it shares.
    #
    # `required: false` is load-bearing: a plain `- .env` makes EVERY compose command fail outright
    # with "env file not found" when the file is absent, which is the normal state on a fresh host
    # that has no overrides. Needs Compose v2.24+ (2023-12); on an older one, delete these lines
    # instead, or `touch .env`.
    env_file:
      - path: .env
        required: false
    environment:
      # PASSED THROUGH ONLY — no defaults here. These four live in config.json under `container`
      # (run_interval_hours, run_on_start, preflight_strict, timezone), and docker/entrypoint.sh
      # resolves them from there on start. Compose interpolates this file before any Python runs, so
      # a default written here would ALWAYS win and the config file could never take effect.
      #
      # Left in place so an override still works — export one in .env or `docker run -e` and it beats
      # the config file, exactly like every other setting.
      RUN_INTERVAL_HOURS: "${RUN_INTERVAL_HOURS:-}"
      RUN_ON_START: "${RUN_ON_START:-}"
      PREFLIGHT_STRICT: "${PREFLIGHT_STRICT:-}"
      TZ: "${TZ:-}"
    volumes:
      # THE config file: profiles, warehouses, cards, credentials and the inlined Google service
      # account. Read-only, because nothing in a scheduled run has any business rewriting what you
      # authored. A bind mount whose host file is missing makes Docker create an empty DIRECTORY
      # here, which preflight reports as "config.json is missing" on start rather than letting the
      # run scrape nothing and exit 0.
      - ./config.json:/app/config.json:ro
      # The app's own state — currently just Costco's refresh tokens.
      # MUST be writable — NOT :ro. Costco ROTATES the refresh token on every refresh and
      # CostcoApiClient._save_auth persists the new one alongside the cached id_token. Mounted
      # read-only, the write raises OSError, Costco falls back to the PAID agent every run, and the
      # rotated token is lost — which can strand the stored one and force a manual re-grab. Keeping
      # it a SEPARATE file from config.json is what lets that stay read-only.
      - ./.state.json:/app/.state.json
      - ./data:/app/data          # generated CSVs (optional; Sheet is source of truth)
      - ./logs:/app/logs          # run.log, the overlap lock, and the .last_run heartbeat
    # Docker's default json-file driver grows without bound. On a Pi that means an SD card filling
    # up months later and taking the whole host down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
