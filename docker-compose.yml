# One service = one instance. Run more instances by copying this with different mounted
# profiles.json / .env (e.g. per proxy pool). Secrets are injected at runtime, never baked in.
#
# Works as-is on a Raspberry Pi (64-bit OS): the image builds for the host's own architecture, and
# no browser runs locally — Browser-Use Cloud holds it. See "Raspberry Pi" in README.md.
services:
  ledger:
    build: .
    image: buying-group-ledger
    container_name: buying-group-ledger
    restart: unless-stopped
    # OPTIONAL. Everything lives in config.json now; .env is only the OVERRIDE layer, for values you
    # want to differ on this host without editing the config it shares. Delete these two lines if you
    # have no overrides — but note RUN_INTERVAL_HOURS below is read by compose itself, not by Python,
    # so that one can only come from the environment.
    env_file:
      - .env
    environment:
      # Set RUN_INTERVAL_HOURS in .env to change the schedule without editing this file; 3 (= 8
      # runs/day) is the default if it isn't set. Each run spends one of MaxOutDeals' 10 daily
      # received-items calls, so preflight WARNS in the log when the interval implies more than
      # that. See "Choosing an interval" in DEPLOY.md.
      RUN_INTERVAL_HOURS: "${RUN_INTERVAL_HOURS:-3}"
      RUN_ON_START: "false"       # set "true" to also run once when the container starts
      PREFLIGHT_STRICT: "false"   # "true" = refuse to start when preflight fails, instead of
                                  # alerting and running degraded (see docker/entrypoint.sh)
      TZ: "America/New_York"      # the cron schedule follows this; UTC if unset
    volumes:
      # THE config file: profiles, warehouses, cards, credentials and the inlined Google service
      # account. Read-only, because nothing in a scheduled run has any business rewriting what you
      # authored. A bind mount whose host file is missing makes Docker create an empty DIRECTORY
      # here, which preflight reports as "config.json is missing" on start rather than letting the
      # run scrape nothing and exit 0.
      - ./config.json:/app/config.json:ro
      # The app's own state — currently just Costco's refresh tokens.
      # MUST be writable — NOT :ro. Costco ROTATES the refresh token on every refresh and
      # CostcoApiClient._save_auth persists the new one alongside the cached id_token. Mounted
      # read-only, the write raises OSError, Costco falls back to the PAID agent every run, and the
      # rotated token is lost — which can strand the stored one and force a manual re-grab. Keeping
      # it a SEPARATE file from config.json is what lets that stay read-only.
      - ./.state.json:/app/.state.json
      - ./data:/app/data          # generated CSVs (optional; Sheet is source of truth)
      - ./logs:/app/logs          # run.log, the overlap lock, and the .last_run heartbeat
    # Docker's default json-file driver grows without bound. On a Pi that means an SD card filling
    # up months later and taking the whole host down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
